name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 1.3.12
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60
    environment: release
    env:
      SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
      SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      SIGNTOOL_PATH: ${{ secrets.SIGNTOOL_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $projectVersion = [string]$props.Project.PropertyGroup.Version
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(?:\.\d+)?$') {
            throw "Invalid release version: $env:RELEASE_VERSION"
          }
          if ($projectVersion -ne $env:RELEASE_VERSION) {
            throw "Workflow version $env:RELEASE_VERSION does not match Directory.Build.props version $projectVersion."
          }
          Write-Output "RELEASE_VERSION=$env:RELEASE_VERSION" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Restore
        run: dotnet restore QHHDesktopStorageBox.sln --nologo

      - name: Build
        run: dotnet build QHHDesktopStorageBox.sln --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test QHHDesktopStorageBox.sln --configuration Release --no-build --nologo

      - name: Decode signing certificate
        if: ${{ env.SIGNING_CERTIFICATE_BASE64 != '' && env.SIGNING_CERTIFICATE_PASSWORD != '' }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "QHHDesktopStorageBox-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          "SIGNING_CERTIFICATE_PATH=$certificatePath" >> $env:GITHUB_ENV

      - name: Publish packages
        shell: pwsh
        run: |
          $arguments = @(
            "-Version", $env:RELEASE_VERSION,
            "-Configuration", "Release",
            "-RuntimeIdentifier", "win-x64"
          )
          if ($env:SIGNING_CERTIFICATE_PATH) {
            $arguments += @(
              "-SigningCertificatePath", $env:SIGNING_CERTIFICATE_PATH,
              "-SigningCertificatePassword", $env:SIGNING_CERTIFICATE_PASSWORD
            )
            if ($env:SIGNTOOL_PATH) {
              $arguments += @("-SignToolPath", $env:SIGNTOOL_PATH)
            }
          } else {
            Write-Warning "Signing secrets are not configured; publishing unsigned artifacts."
          }
          & .\tools\Publish-QHHDesktopStorageBox.ps1 @arguments

      - name: Verify release assets
        shell: pwsh
        run: |
          $assets = @(
            "publish\QHHDesktopStorageBox-Setup-v$env:RELEASE_VERSION-x64.exe",
            "publish\QHHDesktopStorageBox-Setup-v$env:RELEASE_VERSION-x64.exe.sha256",
            "publish\QHHDesktopStorageBox-v$env:RELEASE_VERSION-win-x64.zip",
            "publish\QHHDesktopStorageBox-v$env:RELEASE_VERSION-win-x64.zip.sha256",
            "publish\QHH-Desktop-Storage-Box-User-Manual.pdf"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Missing release asset: $asset"
            }
          }

          foreach ($package in @(
            "publish\QHHDesktopStorageBox-Setup-v$env:RELEASE_VERSION-x64.exe",
            "publish\QHHDesktopStorageBox-v$env:RELEASE_VERSION-win-x64.zip"
          )) {
            $expected = (Get-Content -LiteralPath "$package.sha256" -Raw).Trim().Split(' ')[0]
            $actual = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "SHA-256 mismatch for $package"
            }
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $assets = @(
            "publish/QHHDesktopStorageBox-Setup-v$env:RELEASE_VERSION-x64.exe",
            "publish/QHHDesktopStorageBox-Setup-v$env:RELEASE_VERSION-x64.exe.sha256",
            "publish/QHHDesktopStorageBox-v$env:RELEASE_VERSION-win-x64.zip",
            "publish/QHHDesktopStorageBox-v$env:RELEASE_VERSION-win-x64.zip.sha256",
            "publish/QHH-Desktop-Storage-Box-User-Manual.pdf"
          )
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --target $env:GITHUB_SHA `
              --title "QHH Desktop Storage Box v$env:RELEASE_VERSION" `
              --notes "QHH Desktop Storage Box v$env:RELEASE_VERSION"
          }
          gh release upload $tag @assets --clobber
