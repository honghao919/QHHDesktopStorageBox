name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
            global.json

      - name: Restore
        run: dotnet restore QHHDesktopStorageBox.sln --nologo

      - name: Build
        run: dotnet build QHHDesktopStorageBox.sln --configuration Release --no-restore --nologo

      - name: Test Core
        run: >-
          dotnet test tests/QHHDesktopStorageBox.Core.Tests/QHHDesktopStorageBox.Core.Tests.csproj
          --configuration Release
          --no-build
          --nologo
          --logger "trx;LogFileName=qhh-core-tests.trx"
          --results-directory TestResults

      - name: Test App
        run: >-
          dotnet test tests/QHHDesktopStorageBox.App.Tests/QHHDesktopStorageBox.App.Tests.csproj
          --configuration Release
          --no-build
          --nologo
          --logger "trx;LogFileName=qhh-app-tests.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
