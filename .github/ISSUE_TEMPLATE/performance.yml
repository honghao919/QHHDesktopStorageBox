name: Performance report
description: Report elevated CPU, memory, disk activity, or UI stutter.
title: "[Performance]: "
labels:
  - performance
body:
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, RAM, and disk type
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What is slow or using excessive resources?
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: Include Task Manager CPU, memory, disk values, and the approximate box/item count.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove personal paths or private file names before posting.
